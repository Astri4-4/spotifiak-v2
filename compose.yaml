services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spotifiak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotifiak
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotifiak"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://spotifiak:${POSTGRES_PASSWORD}@db:5432/spotifiak
      DEEMIX_URL: ${DEEMIX_URL}
      DEEMIX_ARL: ${DEEMIX_ARL:-}
      MUSIC_DIR: /music
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    volumes:
      - ${MUSIC_DIR}:/music:ro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
