services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spotifiak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spotifiak
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotifiak"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://spotifiak:${POSTGRES_PASSWORD}@db:5432/spotifiak
      DEEMIX_URL: ${DEEMIX_URL}
      DEEMIX_ARL: ${DEEMIX_ARL:-}
      MUSIC_DIR: /music
      SCAN_INTERVAL_SEC: ${SCAN_INTERVAL_SEC:-300}
      DEEZER_ENRICH: ${DEEZER_ENRICH:-true}
      FULL_SCAN_INTERVAL_HOURS: ${FULL_SCAN_INTERVAL_HOURS:-24}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      PODCAST_DIR: /podcasts
    volumes:
      # Writable so duplicates can be deleted from the scan page.
      - ${MUSIC_DIR}:/music
      # Audio of the YouTube videos added to created podcasts
      - podcasts:/podcasts
    # No published port: the web container proxies /api to it.
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
  podcasts:
