# Keep the original scheme behind another proxy (ingress, Cloudflare): the API uses it
# to make the session cookie HTTPS-only on HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # The API is served on the same origin so the session cookie works everywhere,
  # including <audio> streams and cover images.
  # "api" is the API's compose service, and its Service name in Kubernetes.
  location /api/ {
    proxy_pass http://api:3000/;
    # $http_host keeps the port: the Spotify callback redirects back to this address.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Stream audio as it's read instead of buffering whole files to disk.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    try_files $uri =404;
  }
}
