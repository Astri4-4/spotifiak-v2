# Builds an unsigned Spotifiak.ipa and publishes it as a GitHub release, with a SideStore
# source so the app installs and updates from SideStore. SideStore signs the IPA itself with
# the user's Apple ID, so no certificate or provisioning profile is needed here.
#
# Add this source in SideStore (Sources → +):
#   https://github.com/Astri4-4/spotifiak-v2/releases/latest/download/source.json
name: iOS release

on:
  push:
    branches: [master]
    paths: ['ios/**', '.github/workflows/ios-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
      TAG: ios-v1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen
      - run: cd ios && xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project ios/Spotifiak.xcodeproj \
            -scheme Spotifiak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package IPAs
        run: |
          APP=build/Build/Products/Release-iphoneos/Spotifiak.app
          test -d "$APP"
          mkdir -p dist

          # With the Apple Watch app embedded.
          rm -rf pkg && mkdir -p pkg/Payload && cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry ../dist/Spotifiak.ipa Payload)

          # Without it: a free Apple ID allows 10 app IDs a week and the watch app uses one more.
          rm -rf pkg/Payload/Spotifiak.app/Watch
          (cd pkg && zip -qry ../dist/Spotifiak-NoWatch.ipa Payload)

          ls -l dist

      - name: Write SideStore source
        env:
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/$REPO/releases/download/$TAG"
          SIZE=$(stat -f%z dist/Spotifiak.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" --arg build "$BUILD" --arg date "$DATE" \
            --arg url "$BASE/Spotifiak.ipa" --argjson size "$SIZE" \
            --arg icon "https://github.com/${REPO%%/*}.png" \
            --arg site "https://github.com/$REPO" \
            '{
              name: "Spotifiak",
              identifier: "dev.spotifiak.source",
              website: $site,
              apps: [{
                name: "Spotifiak",
                bundleIdentifier: "dev.spotifiak.ios",
                developerName: "Spotifiak",
                subtitle: "Client for your Spotifiak server",
                localizedDescription: "SwiftUI client for any self-hosted Spotifiak server, with an Apple Watch remote.",
                iconURL: $icon,
                tintColor: "1DB954",
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  size: $size,
                  downloadURL: $url,
                  minOSVersion: "17.0"
                }],
                version: $version,
                versionDate: $date,
                downloadURL: $url,
                size: $size,
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > dist/source.json
          cat dist/source.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/Spotifiak.ipa dist/Spotifiak-NoWatch.ipa dist/source.json \
            --target "$GITHUB_SHA" \
            --title "Spotifiak iOS $VERSION" \
            --notes "Unsigned build of $GITHUB_SHA for SideStore. Add the source https://github.com/${{ github.repository }}/releases/latest/download/source.json or install Spotifiak.ipa directly." \
            --latest
